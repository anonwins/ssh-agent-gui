name: Scorecard

on:
  branch_protection_rule:
  push:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ github.event_name != 'pull_request' && github.repository_visibility == 'public' }}

      # Scorecard policy scores are not code defects. Do not upload them to Code Scanning.
      # Close any leftover Scorecard rows so the Security tab stays CodeQL-only.
      - name: Clear Scorecard rows from Code Scanning
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          nums="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open" \
            --jq '.[] | select((.tool.name // "" | ascii_downcase) | test("scorecard")) | .number')"
          if [ -z "${nums}" ]; then
            echo "No open Scorecard alerts"
            exit 0
          fi
          while IFS= read -r n; do
            echo "Dismissing Scorecard alert #${n}"
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/code-scanning/alerts/${n}" \
              -f state=dismissed \
              -f dismissed_reason="won't fix" \
              -f dismissed_comment="Scorecard policy score, not a code defect. Tracked on Actions and api.scorecard.dev."
          done <<< "${nums}"
